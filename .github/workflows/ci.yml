name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zig-build-and-test:
    name: Zig Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig 0.17-dev
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Run tests
        run: zig build test

  python-test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig 0.17-dev
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build Zig library
        run: zig build -Doptimize=ReleaseFast

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd python-bindings
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          cd python-bindings
          pytest tests/ -v

  js-test:
    name: JS Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js-bindings
        run: bun install

      - name: Run Zod 4 compatibility tests
        working-directory: js-bindings
        run: bun run tests/test-zod4-compat.ts

      - name: Run feature tests
        working-directory: js-bindings
        run: bun run tests/test-all-features.ts

      - name: Run Standard Schema + JSON Schema import tests
        working-directory: js-bindings
        run: bun run tests/test-standard-schema-and-jsonschema.ts
